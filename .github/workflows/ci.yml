# CraftCord CI — synthetic config only; no Discord/RCON/panel secrets.
# Creating this file is not evidence that GitHub Actions has run remotely.
name: CI

# Quoted key: unquoted ``on`` is a YAML 1.1 boolean in some parsers.
"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7.0.1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-python@v7.0.0
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -r requirements-dev.lock

      - name: Run pytest (skip dotenv)
        env:
          CRAFTCORD_SKIP_DOTENV: "1"
        run: python -m pytest tests/ -q --tb=short

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7.0.1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-python@v7.0.0
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-audit.lock

      - name: Audit locked runtime dependencies
        run: pip-audit -r requirements.lock --progress-spinner off
